<line class="raft-arch__edge" x1="360" y1="236" x2="120" y2="298" marker-end="url(#shop-arrow)"></line>
<line class="raft-arch__edge" x1="360" y1="236" x2="300" y2="298" marker-end="url(#shop-arrow)"></line>
