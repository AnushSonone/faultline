<rect class="raft-arch__box" x="308.0" y="20" width="104" height="36"></rect>
<text class="raft-arch__sub" x="360" y="43" text-anchor="middle">frontend-external</text>
<path class="raft-arch__x" d="M 306.0 18 L 318.0 30 M 306.0 30 L 318.0 18"></path>
<rect class="raft-arch__box" x="308.0" y="100" width="104" height="36"></rect>
<text class="raft-arch__sub" x="360" y="123" text-anchor="middle">frontend</text>
<path class="raft-arch__x" d="M 306.0 98 L 318.0 110 M 306.0 110 L 318.0 98"></path>
<rect class="raft-arch__box" x="8.0" y="200" width="104" height="36"></rect>
<text class="raft-arch__sub" x="60" y="223" text-anchor="middle">ad</text>
<rect class="raft-arch__box" x="128.0" y="200" width="104" height="36"></rect>
<text class="raft-arch__sub" x="180" y="223" text-anchor="middle">recommendation</text>
<path class="raft-arch__x" d="M 126.0 198 L 138.0 210 M 126.0 210 L 138.0 198"></path>
<rect class="raft-arch__box" x="308.0" y="200" width="104" height="36"></rect>
<text class="raft-arch__sub" x="360" y="223" text-anchor="middle">checkout</text>
<path class="raft-arch__x" d="M 306.0 198 L 318.0 210 M 306.0 210 L 318.0 198"></path>
<rect class="raft-arch__box" x="448.0" y="200" width="104" height="36"></rect>
<text class="raft-arch__sub" x="500" y="223" text-anchor="middle">currency</text>
<rect class="raft-arch__box" x="568.0" y="200" width="104" height="36"></rect>
<text class="raft-arch__sub" x="620" y="223" text-anchor="middle">shipping</text>
<rect class="raft-arch__box" x="68.0" y="300" width="104" height="36"></rect>
<text class="raft-arch__sub" x="120" y="323" text-anchor="middle">cart</text>
<rect class="raft-arch__box" x="248.0" y="300" width="104" height="36" style="fill:#000"></rect>
<text class="raft-arch__sub" x="300" y="323" text-anchor="middle" style="fill:#fff">productcatalog</text>
<rect class="raft-arch__box" x="388.0" y="300" width="104" height="36"></rect>
<text class="raft-arch__sub" x="440" y="323" text-anchor="middle">email</text>
<rect class="raft-arch__box" x="508.0" y="300" width="104" height="36"></rect>
<text class="raft-arch__sub" x="560" y="323" text-anchor="middle">payment</text>
<rect class="raft-arch__box" x="68.0" y="400" width="104" height="36"></rect>
<text class="raft-arch__sub" x="120" y="423" text-anchor="middle">redis</text>
<text class="raft-arch__sub" x="560" y="40" text-anchor="start">the pager says: frontend is slow</text>
<line class="raft-arch__edge" x1="556" y1="44" x2="414" y2="112" marker-end="url(#shop-arrow)"></line>
<text class="raft-arch__sub" x="560" y="60" text-anchor="start">which is true, and two hops</text>
<text class="raft-arch__sub" x="560" y="76" text-anchor="start">from what actually broke</text>
<text class="raft-arch__sub" x="360" y="462" text-anchor="middle">filled: where the memory leak is. crossed: every service that calls it, and therefore slows down.</text>
<text class="raft-arch__sub" x="360" y="480" text-anchor="middle">the eight others are fine, and a dashboard sorted by error rate will still list all twelve.</text>
</svg>
