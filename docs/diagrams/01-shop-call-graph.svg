<line class="raft-arch__edge" x1="360" y1="236" x2="560" y2="298" marker-end="url(#shop-arrow)"></line>
<line class="raft-arch__edge" x1="360" y1="236" x2="500" y2="198" marker-end="url(#shop-arrow)"></line>
<line class="raft-arch__edge" x1="360" y1="236" x2="620" y2="198" marker-end="url(#shop-arrow)"></line>
