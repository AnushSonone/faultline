<svg xmlns="http://www.w3.org/2000/svg" class="raft-arch" viewBox="0 0 720 500" role="img" aria-labelledby="shop-title shop-desc">
<style>
  svg { font-family: Georgia, "Times New Roman", serif; }
  .raft-arch__box { fill: none; stroke: #cccccc; stroke-width: 1; }
  .raft-arch__zone { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 5 5; }
  .raft-arch__edge { fill: none; stroke: #cccccc; stroke-width: 1.25; }
  .raft-arch__arrow { fill: #cccccc; }
  .raft-arch__dot { fill: none; stroke: #000000; stroke-width: 1.25; }
  .raft-arch__dot--leader { fill: #000000; }
  .raft-arch__dot--dead { stroke: #cccccc; }
  .raft-arch__x { fill: none; stroke: #444444; stroke-width: 1.25; }
  .raft-arch__ring { fill: none; stroke: #000000; stroke-width: 1; stroke-dasharray: 3 3; }
  .raft-arch__title { fill: #000000; font-size: 15px; }
  .raft-arch__sub, .raft-arch__edge-label { fill: #444444; font-size: 12px; }
</style>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"></rect>

<title id="shop-title">one shop, one leak, and where the pager points</title>
<desc id="shop-desc">the twelve services of the online boutique that the real cases come from, drawn as a call graph. the frontend calls seven services, checkout calls six, recommendation calls the product catalog, and the cart keeps its data in redis. a memory leak in the product catalog is drawn as the filled box. three services call it directly, recommendation, checkout, and the frontend, so all three slow down and are drawn crossed, and the pager fires for the frontend, two hops from the cause. the eight services that never touch the catalog stay healthy.</desc>
<defs><marker id="shop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="raft-arch__arrow" d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>
<line class="raft-arch__edge" x1="360" y1="56" x2="360" y2="98" marker-end="url(#shop-arrow)"></line>
<line class="raft-arch__edge" x1="360" y1="136" x2="60" y2="198" marker-end="url(#shop-arrow)"></line>
