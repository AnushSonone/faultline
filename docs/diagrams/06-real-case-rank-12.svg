<rect class="raft-arch__box" x="584" y="308" width="104" height="28"></rect>
<text class="raft-arch__sub" x="636" y="327" text-anchor="middle">redis</text>
<path class="raft-arch__x" d="M 582 306 L 594 318 M 582 318 L 594 306"></path>
<text class="raft-arch__sub" x="636" y="350" text-anchor="middle">rank 10, 0.20</text>
<text class="raft-arch__sub" x="360" y="392" text-anchor="middle">every box is crossed: on real telemetry, everything strays at once, so anomaly strength is a tie twelve ways.</text>
<text class="raft-arch__sub" x="360" y="410" text-anchor="middle">the ranking is then decided by the small features, and by the penalty, which is exactly backwards for a leaf service.</text>
<text class="raft-arch__sub" x="360" y="428" text-anchor="middle">a plain z-score threshold ignores the graph entirely and, on these fifteen cases, gets the answer 93% of the time.</text>
