<title id="real-title">a real cpu fault on the email service, and why it lands at rank 12</title>
<desc id="real-desc">the call graph the engine actually reconstructed from the sampled traces of a real rcaeval case: the frontend calls checkout, currency, the product catalog, and recommendation; checkout calls currency, email, payment, and the product catalog; recommendation calls the product catalog. every one of the twelve services is drawn crossed, because every one of them strayed from its own baseline during the fault. five services, ad, cart, shipping, redis, and the external frontend, appear only in metrics because the one-in-eight trace sample never caught a call to them. the true cause, email, is filled and ranked twelfth at 0.15; currency is ranked first at 0.39.</desc>
