<rect x="0" y="0" width="720" height="420" fill="#ffffff"></rect>

<title id="lat-title">the guided incident, as the engine sees it</title>
<desc id="lat-desc">p99 latency per service over the fifteen seconds of the guided incident, on the event-time clock. all five services sit at 40 milliseconds. a deployment marker lands at five seconds. recommendation starts climbing in the same second and reaches 314 milliseconds by the end. checkout and the frontend start climbing two seconds later, at seven seconds, and end near 202 milliseconds, following the same curve as each other. cart and the product catalog stay flat at 40 the whole time. the values are the ddsketch p99 from the heatmap, so the chart and the box above agree.</desc>
