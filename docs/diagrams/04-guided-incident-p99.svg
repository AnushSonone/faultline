<text class="raft-arch__sub" x="52" y="334.0" text-anchor="end">0</text>
<line class="raft-arch__zone" x1="60" y1="241.8" x2="700" y2="241.8"></line>
<text class="raft-arch__sub" x="52" y="245.76470588235293" text-anchor="end">100</text>
