<text class="raft-arch__sub" x="52" y="157.52941176470588" text-anchor="end">200</text>
<line class="raft-arch__zone" x1="60" y1="65.3" x2="700" y2="65.3"></line>
<text class="raft-arch__sub" x="52" y="69.29411764705884" text-anchor="end">300</text>
<text class="raft-arch__sub" x="52" y="20" text-anchor="end">p99 ms</text>
<text class="raft-arch__sub" x="60.0" y="348" text-anchor="middle">0s</text>
