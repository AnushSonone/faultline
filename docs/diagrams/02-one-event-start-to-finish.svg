<svg xmlns="http://www.w3.org/2000/svg" class="raft-arch" viewBox="0 0 720 600" role="img" aria-labelledby="flow-title flow-desc">
<style>
  svg { font-family: Georgia, "Times New Roman", serif; }
  .raft-arch__box { fill: none; stroke: #cccccc; stroke-width: 1; }
  .raft-arch__zone { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 5 5; }
  .raft-arch__edge { fill: none; stroke: #cccccc; stroke-width: 1.25; }
  .raft-arch__arrow { fill: #cccccc; }
  .raft-arch__dot { fill: none; stroke: #000000; stroke-width: 1.25; }
  .raft-arch__dot--leader { fill: #000000; }
  .raft-arch__dot--dead { stroke: #cccccc; }
  .raft-arch__x { fill: none; stroke: #444444; stroke-width: 1.25; }
  .raft-arch__ring { fill: none; stroke: #000000; stroke-width: 1; stroke-dasharray: 3 3; }
  .raft-arch__title { fill: #000000; font-size: 15px; }
  .raft-arch__sub, .raft-arch__edge-label { fill: #444444; font-size: 12px; }
</style>
<rect x="0" y="0" width="720" height="600" fill="#ffffff"></rect>

<title id="flow-title">one event, start to finish</title>
<desc id="flow-desc">an event is read from disk stamped with the time it happened. the watermark for its partition decides whether it is on time, up to two seconds late, or later than that, in which case it is counted but kept out of query state. the window it belongs to absorbs it, updating a ddsketch percentile at alpha 0.01. the service's rolling median and mad baseline turns it into a z-score. whatever changed on screen, a heatmap cell, a timeline tick, a score, goes to the page in one websocket frame carrying a sequence number. the page redraws. if the page notices a gap in the sequence it asks for a resync and the engine sends its current snapshot so the stream can continue.</desc>

<defs>
<marker id="faultline-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path class="raft-arch__arrow" d="M 0 0 L 10 5 L 0 10 z"></path>
</marker>
</defs>

<rect class="raft-arch__box" x="40" y="8" width="220" height="44"></rect>
<text class="raft-arch__title" x="150" y="35" text-anchor="middle">the engine</text>

<rect class="raft-arch__box" x="450" y="8" width="240" height="44"></rect>
<text class="raft-arch__title" x="570" y="35" text-anchor="middle">this page</text>

<line class="raft-arch__zone" x1="150" y1="52" x2="150" y2="72"></line>
<line class="raft-arch__zone" x1="150" y1="120" x2="150" y2="136"></line>
<line class="raft-arch__zone" x1="150" y1="198" x2="150" y2="214"></line>
<line class="raft-arch__zone" x1="150" y1="262" x2="150" y2="278"></line>
<line class="raft-arch__zone" x1="150" y1="326" x2="150" y2="486"></line>
<line class="raft-arch__zone" x1="570" y1="52" x2="570" y2="370"></line>
<line class="raft-arch__zone" x1="570" y1="432" x2="570" y2="534"></line>

<rect class="raft-arch__box" x="40" y="72" width="220" height="48"></rect>
<text class="raft-arch__sub" x="150" y="92" text-anchor="middle">1. an event is read from disk</text>
<text class="raft-arch__sub" x="150" y="108" text-anchor="middle">stamped with when it happened</text>

<rect class="raft-arch__box" x="40" y="136" width="220" height="62"></rect>
<text class="raft-arch__sub" x="150" y="156" text-anchor="middle">2. the watermark places it</text>
<text class="raft-arch__sub" x="150" y="172" text-anchor="middle">on time, or up to 2s late, is fine.</text>
<text class="raft-arch__sub" x="150" y="188" text-anchor="middle">later than that is counted, not trusted</text>

<rect class="raft-arch__box" x="40" y="214" width="220" height="48"></rect>
<text class="raft-arch__sub" x="150" y="234" text-anchor="middle">3. its window absorbs it</text>
<text class="raft-arch__sub" x="150" y="250" text-anchor="middle">p99 via a DDSketch, alpha 0.01</text>

<rect class="raft-arch__box" x="40" y="278" width="220" height="48"></rect>
<text class="raft-arch__sub" x="150" y="298" text-anchor="middle">4. the baseline judges it</text>
<text class="raft-arch__sub" x="150" y="314" text-anchor="middle">how far from this service's own normal?</text>

<line class="raft-arch__edge" x1="262" y1="350" x2="448" y2="350" marker-end="url(#faultline-flow-arrow)"></line>
<text class="raft-arch__edge-label" x="355" y="344" text-anchor="middle">5. one websocket frame: what changed, and a sequence number</text>

<rect class="raft-arch__box" x="450" y="370" width="240" height="62"></rect>
<text class="raft-arch__sub" x="570" y="390" text-anchor="middle">6. the page redraws</text>
<text class="raft-arch__sub" x="570" y="406" text-anchor="middle">a heatmap cell, a timeline tick,</text>
<text class="raft-arch__sub" x="570" y="422" text-anchor="middle">a score moving up the list</text>

<line class="raft-arch__edge" x1="448" y1="462" x2="262" y2="462" marker-end="url(#faultline-flow-arrow)"></line>
<text class="raft-arch__edge-label" x="355" y="456" text-anchor="middle">7. missed a number? ask for a resync</text>

<rect class="raft-arch__box" x="40" y="486" width="220" height="48"></rect>
<text class="raft-arch__sub" x="150" y="506" text-anchor="middle">8. the engine sends its snapshot</text>
<text class="raft-arch__sub" x="150" y="522" text-anchor="middle">and the stream picks up from there</text>

<text class="raft-arch__sub" x="360" y="566" text-anchor="middle">pressing play runs this loop at ten times real time, about 37 frames a second to the page.</text>
<text class="raft-arch__sub" x="360" y="584" text-anchor="middle">scrub backwards and the scores empty out, because a score only ever counts evidence up to the cursor.</text>
</svg>
