<rect x="180.0" y="120" width="100.0" height="24" style="fill:#000000;stroke:#fff;stroke-width:1"></rect>
<text class="raft-arch__sub" x="230.0" y="136" text-anchor="middle" style="fill:#fff">anomaly</text>
<rect x="280.0" y="120" width="37.5" height="24" style="fill:#2a2a2a;stroke:#fff;stroke-width:1"></rect>
