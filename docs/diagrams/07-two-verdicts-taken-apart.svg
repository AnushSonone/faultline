<rect x="0" y="0" width="720" height="470" fill="#ffffff"></rect>

<title id="score-title">two verdicts taken apart</title>
<desc id="score-desc">stacked bars of the nine score components for the top three candidates in the guided incident, and for three candidates in a real cpu fault on the email service. in the guided case recommendation scores 0.86, with anomaly strength, precedence, failed trace coverage, critical path, topology, and the nearby deploy all contributing, while checkout and the frontend score 0.48 and 0.46 mostly from anomaly strength and failed traces. in the real case every service has the same saturated anomaly strength and nearly the same precedence, so the currency service leads at 0.39 on a hair of topology, and the email service, the true cause, sits at 0.15 because it takes the full contradiction penalty.</desc>
<text class="raft-arch__title" x="20" y="22" text-anchor="start">the guided incident: recommendation, taken apart</text>
<text class="raft-arch__sub" x="105" y="57" text-anchor="end">recommendation</text>
