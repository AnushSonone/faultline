<svg xmlns="http://www.w3.org/2000/svg" class="raft-arch" viewBox="0 0 720 470" role="img" aria-labelledby="score-title score-desc">
<style>
  svg { font-family: Georgia, "Times New Roman", serif; }
  .raft-arch__box { fill: none; stroke: #cccccc; stroke-width: 1; }
  .raft-arch__zone { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 5 5; }
  .raft-arch__edge { fill: none; stroke: #cccccc; stroke-width: 1.25; }
